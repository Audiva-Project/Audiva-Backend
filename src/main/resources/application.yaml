server:
  port: 8080
  servlet:
    context-path: /api/v1
  multipart:
    max-file-size: 50MB
    max-request-size: 100MB

spring:
  datasource:
    url: ${DBMS_CONNECTION}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  #    properties:
  #      hibernate:
  #        show_sql: true
  #        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  accessTokenExpiration: ${JWT_ACCESS_EXPIRATION}
  refreshTokenExpiration: ${JWT_REFRESH_EXPIRATION}

vnpay:
  tmn-code: ${VNPAY_CODE}
  hash-secret: ${VNPAY_SECRET}
  vnp-url: ${VNPAY_URL}
  vnp-return-url: ${VNPAY_RETURN_URL}

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}